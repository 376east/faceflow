name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q app.py recognition.py scripts tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/app.js
      - name: Download and verify pinned models
        run: python scripts/download_models.py
      - name: Client control-flow tests
        run: node --test tests/test_upload.cjs tests/test_settings.cjs tests/test_readiness.cjs tests/test_search.cjs tests/test_expiry.cjs
      - name: Integration tests with branch coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Coverage report
        if: always()
        run: |
          python -m coverage report -m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage html -d work/coverage/html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage json -o work/coverage/coverage.json
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: work/coverage/
          if-no-files-found: error
          retention-days: 14
