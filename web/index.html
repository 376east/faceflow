<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f9f5"><title>FaceFlow</title><link rel="stylesheet" href="/assets/style.css"><script defer src="/assets/app.js"></script></head>
<body><header><a href="/" class="brand" aria-label="FaceFlow, главная"><span class="brand-mark" aria-hidden="true">f<span>f</span></span><span>FaceFlow</span></a><span class="header-note">В кадре — ты.</span></header><main id="app" tabindex="-1"><p class="loading">Загрузка…</p></main><footer>FaceFlow · кадры остаются с тобой</footer><dialog id="viewer" aria-label="Просмотр фотографии"><button id="close-viewer" class="icon-button modal-close" aria-label="Закрыть">×</button><img id="large-photo" alt=""><div class="viewer-nav"><button id="viewer-prev" class="icon-button" aria-label="Предыдущий кадр">←</button><span id="viewer-position" aria-live="polite"></span><button id="viewer-next" class="icon-button" aria-label="Следующий кадр">→</button><label class="check" id="viewer-selection" hidden><input id="viewer-check" type="checkbox"><span>В подборку</span></label></div><div class="modal-actions"><a id="large-download" class="button" download>Скачать</a><button id="not-me" class="text-button" type="button">Это не я</button></div><p id="viewer-status" class="status" aria-live="polite"></p></dialog><dialog id="confirm-action" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title">Подтвердите действие</h2><p id="confirm-message"></p><div class="modal-actions"><button class="secondary" value="cancel" autofocus>Отмена</button><button class="danger" value="confirm">Продолжить</button></div></form></dialog></body></html>
